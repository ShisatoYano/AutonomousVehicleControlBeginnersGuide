name: PR_Evidence

# Checks that the PR description shows how the change was checked, has images when it
# changes code under src/ (see HOWTOCONTRIBUTE.md, Step 4), and doesn't close an issue that
# is done in several PRs (label "multiple PRs"). It also checks that the PR refers to an issue
# assigned to its author (see "Claim an issue before you start" in HOWTOCONTRIBUTE.md).
# pull_request_target runs without the approval that first-time contributors' PRs need.
# It is safe only because this job never checks out or runs the PR's code: keep it that way.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: PR description has evidence
    steps:
    - name: Check the description
      env:
        # Passed through env, never expanded into the script, since the body is untrusted text
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        NO_IMAGES_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no images needed') }}
        NO_ISSUE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no issue needed') }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed_files.txt
        gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F number="$PR_NUMBER" -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $number) {
              closingIssuesReferences(first: 20) { nodes { number labels(first: 20) { nodes { name } } } }
            } }
          }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                  | select(any(.labels.nodes[]; .name == "multiple PRs")) | .number' > multi_pr_issues.txt
        python3 - <<'EOF'
        import json
        import os
        import re
        import subprocess
        import sys

        body = re.sub(r"<!--.*?-->", "", os.environ.get("PR_BODY") or "", flags=re.S)
        files = open("changed_files.txt").read().split()
        errors = []

        for issue in open("multi_pr_issues.txt").read().split():
            errors.append(
                f"#{issue} is done in several PRs, so merging this PR must not close it: "
                f'write "Part of #{issue}" instead of "Closes", "Fixes" or "Resolves #{issue}". '
                "The maintainer closes it after the last PR."
            )

        # PRs opened before the PR template was added are reviewed by hand for the evidence
        if os.environ["PR_CREATED_AT"] >= "2026-11-14":
            checked = re.search(r"^##\s*How I checked it works\s*$(.*?)(?=^##\s|\Z)", body, flags=re.M | re.S)
            if not checked or not checked.group(1).strip():
                errors.append('Fill in "How I checked it works": the tests you ran and what you looked at.')

            changes_code = any(f.startswith("src/") and f.endswith(".py") for f in files)
            has_image = re.search(r"!\[[^\]]*\]\(|<img\s|https://github\.com/user-attachments/assets/", body)
            if changes_code and not has_image and os.environ["NO_IMAGES_LABEL"] != "true":
                errors.append(
                    "This PR changes code under src/, so add images or GIFs under \"Images\" "
                    "(drag and drop them into the description): the demo GIF of a new simulation or algorithm, "
                    "or for a change to existing code, the last frame of one or two simulations that use it, "
                    "before and after your change."
                )

        # Assigning the author doesn't run this check again, so the message asks for an edit
        if (os.environ["PR_CREATED_AT"] >= "2026-11-27"
                and os.environ["AUTHOR_ASSOCIATION"] not in ("OWNER", "MEMBER", "COLLABORATOR")
                and os.environ["NO_ISSUE_LABEL"] != "true"):
            # Only the first 10 references, since each one is an API call
            refs = list(dict.fromkeys(re.findall(
                r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|part\s+of):?\s+#(\d+)\b", body, flags=re.I)))[:10]
            author = os.environ["PR_AUTHOR"]
            unreadable = []

            def assignees(number):
                result = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/issues/{number}"],
                                        capture_output=True, text=True)
                if result.returncode != 0:
                    print(result.stderr, file=sys.stderr)
                    if "HTTP 404" not in result.stderr:
                        unreadable.append(number)
                    return []
                issue = json.loads(result.stdout)
                # The maintainer assigns PRs to their authors, so a PR number must not count as an issue
                if "pull_request" in issue or issue["state"] != "open":
                    return []
                return [a["login"] for a in issue["assignees"]]

            if not any(author in assignees(n) for n in refs):
                if unreadable:
                    errors.append(
                        "Couldn't read " + ", ".join(f"#{n}" for n in unreadable) + " to check who is assigned. "
                        "Please edit the description in a while to run this check again."
                    )
                else:
                    errors.append(
                        f"Refer to an issue assigned to you (@{author}) in the description, with \"Closes #123\", "
                        "or \"Part of #123\" for an issue labeled \"multiple PRs\". "
                        "For an issue labeled \"good first issue\" or \"help wanted\", comment \"/claim\" on it to be assigned. "
                        "For other issues, ask the maintainer in the issue. "
                        "After you are assigned, edit the description to run this check again. See "
                        f"https://github.com/{os.environ['GH_REPO']}/blob/main/HOWTOCONTRIBUTE.md#claim-an-issue-before-you-start"
                    )

        for e in errors:
            print(f"::error::{e}")
        if errors:
            print("See Step 4 of HOWTOCONTRIBUTE.md. Editing the description runs this check again.")
            sys.exit(1)
        print("The description has what the reviewer needs.")
        EOF
